<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&display=swap" rel="stylesheet">
<style>
:root { --ground:#eeeff1; --ink:#1b1f26; --ink-2:#454a53; --muted:#5f6570; --rule:#d3d6db; --brass:#b8862b; --brass-ink:#7a5715;
  --serif:"Literata","Iowan Old Style","Palatino Linotype",Georgia,serif; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --ground:#15181d; --ink:#e6e8eb; --ink-2:#c3c7cd; --muted:#9aa1ab; --rule:#2c323b; --brass:#c9a04a; --brass-ink:#e2bd6b; } }
* { box-sizing: border-box; }
html { font-size: 17px; }
body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--serif); font-optical-sizing:auto; line-height:1.5; -webkit-font-smoothing:antialiased; }
.page { max-width: 62rem; margin: 0 auto; padding: clamp(3rem,8vw,6rem) clamp(1rem,4vw,3rem) 5rem; }
h1 { font-size: clamp(2.2rem,5vw,3.6rem); font-weight:400; font-variation-settings:"opsz" 72; letter-spacing:-0.015em; line-height:1.05; margin:0 0 0.6rem; }
.lede { color: var(--ink-2); max-width: 52ch; margin: 0 0 3rem; font-size: 1.15rem; }
ol { list-style:none; padding:0; margin:0; }
.row { display:grid; grid-template-columns: 9rem 1fr; gap:0 1.5rem; padding:1.4rem 0; border-top:1px solid var(--rule); }
.row:last-child { border-bottom:1px solid var(--rule); }
.date { color: var(--muted); font-variant-numeric: tabular-nums; padding-top:0.25rem; }
.motion { font-size:1.45rem; font-variation-settings:"opsz" 28; line-height:1.2; text-decoration:none; color:var(--ink); }
.motion:hover { text-decoration: underline; text-decoration-color: var(--brass); text-underline-offset:0.15em; }
.motion::before { content:"\201C"; color:var(--brass); } .motion::after { content:"\201D"; color:var(--brass); }
.sub { margin:0.4rem 0 0; color:var(--ink-2); max-width:66ch; }
.empty { color: var(--muted); }
@media (max-width: 640px) { html{font-size:16px} .row { grid-template-columns: 1fr; gap:0.2rem; } }
</style>
</head>
<body>
<div class="page">
  <h1>Debates</h1>
  <p class="lede">Formal parliamentary debates between language models, on books and on questions worth arguing. Each one is adjudicated, scored and reproduced in full. 0 so far.</p>

</div>
</body>
</html>
